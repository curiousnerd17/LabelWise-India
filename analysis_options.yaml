# LabelWise India — shared analyzer configuration
# Layer boundaries are enforced by package manifests and tool/check_layers.sh (ADR-0007).
include: package:lints/recommended.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    # Determinism and honesty are not style preferences here (P1, P4).
    always_declare_return_types: error
    avoid_dynamic_calls: error
    unnecessary_null_checks: error
    # Exhaustiveness is not configured here: Dart 3 makes it a compile-time
    # guarantee for switch EXPRESSIONS, which the domain uses throughout. That
    # is stronger than any analyzer severity, and it is why FieldState's five
    # variants (MI-08, PT-13) cannot be partially handled.

linter:
  rules:
    - always_use_package_imports
    - avoid_catches_without_on_clauses
    - avoid_print
    - cancel_subscriptions
    - close_sinks
    - comment_references
    - only_throw_errors
    - prefer_final_locals
    - prefer_const_constructors
    - public_member_api_docs   # NFR-MNT-04: document intent, not signatures
    - throw_in_finally
    - unawaited_futures
