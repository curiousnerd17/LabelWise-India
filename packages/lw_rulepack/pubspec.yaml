name: lw_rulepack
description: >-
  Rule pack schema binding, deserialisation and integrity verification.
  Isolated so that lw_domain never learns what JSON is (ADR-0012).
publish_to: none
version: 0.1.0

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  lw_domain:
    path: ../lw_domain

dev_dependencies:
  lints: ^4.0.0
  test: ^1.25.0
